# Xcode project for Arcfold, generated with XcodeGen (ADR 0004).
# Run Scripts/bootstrap.sh, or `xcodegen generate` after changing this file.
# The generated Arcfold.xcodeproj is not committed.

name: Arcfold

options:
  minimumXcodeGenVersion: 2.45.4
  xcodeVersion: "27.2"
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: en
  defaultConfig: Debug
  createIntermediateGroups: true
  # Refuses to generate the project while a core is missing or outdated.
  # Xcode itself only reports "There is no XCFramework found at ...".
  preGenCommand: Scripts/bootstrap.sh --check

configs:
  Debug: debug
  Release: release
  Debug-JIT: debug
  Release-JIT: release

settings:
  base:
    # Project defaults of the Xcode 27.2 app template that XcodeGen's presets lack
    CLANG_CXX_LANGUAGE_STANDARD: gnu++20
    GCC_C_LANGUAGE_STANDARD: gnu17
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    # The cores exist for arm64 only (Scripts/build-core.sh), so the app does too.
    ARCHS: arm64

packages:
  LibretroKit:
    path: Packages/LibretroKit
  FoldLayout:
    path: Packages/FoldLayout
  Renderer:
    path: Packages/Renderer

targets:
  Arcfold:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          # Merged into the generated Info.plist (INFOPLIST_FILE), not a resource
          - Info.plist
      # License texts for the Licenses screen (plan, hard rules; ADR 0005 and
      # 0006), copied from their originals into Arcfold.app/Licenses/<folder>/.
      # A core added later brings its texts here as well; LicenseCatalog lists
      # them and BundleContentTests checks that they arrive.
      - path: LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/Arcfold
      - path: Cores/mgba/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/mGBA
      - path: Cores/mgba/src/third-party/blip_buf/license.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/blip_buf
      - path: Cores/mgba/src/third-party/inih/LICENSE.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/inih
      - path: Packages/LibretroKit/Sources/CLibretro/include/libretro.h
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/libretro.h
      # melonDS DS and the parts built into it (ADR 0006). melondsds-LICENSE.txt.in
      # holds the notices melonDS DS collects itself; the app shows only the
      # sections of libretro-common, date and Open Sans from it, because the
      # file also names parts Arcfold does not build (Dolphin, pcap) and lacks
      # blip_buf, which the mGBA entry covers.
      - path: Cores/melonds-ds/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/melonDS-DS
      - path: Cores/melonds-ds/cmake/melondsds-LICENSE.txt.in
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/melonDS-DS-notices
      - path: Cores/melonds-ds-deps/melonDS/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/melonDS
      - path: Cores/melonds-ds-deps/melonDS/freebios/drastic_bios_readme.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/FreeBIOS
      - path: Cores/melonds-ds-deps/melonDS/src/fatfs/LICENSE.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/FatFs
      - path: Cores/melonds-ds-deps/melonDS/src/teakra/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/teakra
      - path: Cores/melonds-ds-deps/melonDS/src/tiny-AES-c/unlicense.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/tiny-AES-c
      - path: Cores/melonds-ds-deps/melonDS/src/xxhash/xxhash.h
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/xxHash
      - path: Cores/melonds-ds-deps/libslirp/COPYRIGHT
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/libslirp
      - path: Cores/melonds-ds-deps/libslirp/src/tcp_var.h
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/libslirp-BSD
      - path: Cores/melonds-ds-deps/libslirp/src/util.h
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/libslirp-MIT
      - path: Cores/melonds-ds-deps/fmt/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/fmt
      - path: Cores/melonds-ds-deps/glm/copying.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/GLM
      - path: Cores/melonds-ds-deps/pntr/LICENSE.md
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/pntr
      - path: Cores/melonds-ds-deps/yamc/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/yamc
      - path: Cores/melonds-ds-deps/span-lite/LICENSE.txt
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/span-lite
      - path: Cores/melonds-ds-deps/zlib/LICENSE
        buildPhase:
          copyFiles:
            destination: resources
            subpath: Licenses/zlib
    dependencies:
      - package: LibretroKit
      - package: FoldLayout
      - package: Renderer
      # Libretro cores (ADR 0003): copied into Arcfold.app/Frameworks and signed,
      # never linked, because every core exports the same retro_* symbols.
      # LibretroKit loads them with dlopen. A new core needs a recipe in
      # Scripts/cores/ and an entry here; Scripts/bootstrap.sh builds every core
      # listed here. Until CI reads this list too (planned for M3, together with
      # the recipe hook for nested submodules), a new core also needs its
      # submodule in the "Fetch core sources" step and in the cache key of
      # .github/workflows/ci.yml. A core for the JIT build only (Play!) is also
      # left out of Debug and Release with
      # EXCLUDED_SOURCE_FILE_NAMES: <CORE_NAME>.framework.
      - framework: Cores/Build/mgba_libretro.xcframework
        embed: true
        link: false
      - framework: Cores/Build/melondsds_libretro.xcframework
        embed: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faentiver.arcfold
        INFOPLIST_KEY_CFBundleDisplayName: Arcfold
        # systemIndigo from Assets.xcassets (ADR 0007); the app icon is App/Resources/AppIcon.icon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        # Keys without a build setting: frame rates above 60 Hz, Game Mode and
        # the imported file types for GBA and DS games (ADR 0005, ADR 0006)
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
      configs:
        # Sideloading build with JIT (StikDebug needs get-task-allow).
        # Only here: the Store build must not contain a JIT code path.
        Debug-JIT: &jit
          PRODUCT_BUNDLE_IDENTIFIER: com.faentiver.arcfold.jit
          INFOPLIST_KEY_CFBundleDisplayName: Arcfold JIT
          CODE_SIGN_ENTITLEMENTS: App/Arcfold-JIT.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) JIT_BUILD
          GCC_PREPROCESSOR_DEFINITIONS: $(inherited) JIT_BUILD=1
        Release-JIT: *jit

  # Unit tests with the app as host. Core/ holds the tests with a real core,
  # App/ the tests of the app, Support/ what both share (ADR 0005).
  ArcfoldTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ArcfoldTests
      # Test programs go into the test bundles only, never into the app
      # (Tests/Fixtures/LICENSES.md). Generators and license files stay out.
      - path: Tests/Fixtures/gba
        includes:
          - "*.gba"
        buildPhase: resources
      - path: Tests/Fixtures/ds
        includes:
          - "*.nds"
        buildPhase: resources
    dependencies:
      - target: Arcfold
      - package: LibretroKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faentiver.arcfold.tests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO

  # UI tests that drive the app like a person: library, game screen, Licenses.
  ArcfoldUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/ArcfoldUITests
      - path: Tests/Fixtures/gba
        includes:
          - "*.gba"
        buildPhase: resources
      - path: Tests/Fixtures/ds
        includes:
          - "*.nds"
        buildPhase: resources
    dependencies:
      - target: Arcfold
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.faentiver.arcfold.uitests
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        STRING_CATALOG_GENERATE_SYMBOLS: NO

schemes:
  Store:
    build:
      targets:
        Arcfold: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ArcfoldTests
        - package: LibretroKit/LibretroKitTests
        - package: FoldLayout/FoldLayoutTests
        - package: Renderer/RendererTests
        # The UI is the same in both builds, so only Store runs the UI tests.
        - ArcfoldUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  JIT:
    build:
      targets:
        Arcfold: all
    run:
      config: Debug-JIT
    test:
      config: Debug-JIT
      targets:
        - ArcfoldTests
        - package: LibretroKit/LibretroKitTests
        - package: FoldLayout/FoldLayoutTests
        - package: Renderer/RendererTests
    profile:
      config: Release-JIT
    analyze:
      config: Debug-JIT
    archive:
      config: Release-JIT
